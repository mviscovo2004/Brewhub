name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main", "review" ]
  pull_request:
    branches: [ "main", "review" ]
  schedule:
    - cron: '30 1 * * 0' # Esegue una scansione ogni domenica notte

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Impostiamo Java 11 come richiesto dal tuo pom.xml
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'

    # Inizializza CodeQL
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    # COMPILAZIONE MANUALE
    # CodeQL deve "osservare" la compilazione per analizzare il codice Java.
    # Usiamo -DskipTests perché a CodeQL interessa il codice sorgente, 
    # non l'esecuzione dei test grafici (che potrebbero fallire qui).
    - name: Build Java Project
      run: |
        mvn -B clean package -DskipTests -f brewhub/pom.xml

    # Esegue l'analisi finale
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
