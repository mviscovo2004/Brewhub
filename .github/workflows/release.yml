name: Create Release
on:
  push:
    tags:
      - 'v*' # Si attiva solo se il tag inizia con "v", es. v1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      # Compila e pacchetta (assicurati che il pom.xml generi un jar eseguibile)
      - name: Build with Maven
        working-directory: ./brewhub
        run: mvn -B package -DskipTests # Saltiamo i test qui se li abbiamo già fatti nella CI

      # Crea la Release su GitHub
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: brewhub/target/*.jar # Carica il JAR generato
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
